<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wipfel · dev · terrain</title>
  <link rel="stylesheet" href="../../css/base.css">
  <style>
    #info { position: fixed; left: 12px; top: 12px; max-width: 34rem; padding: 10px 12px; background: var(--hud-bg);
      border: 1px solid var(--hud-line); border-radius: var(--radius); font: 12px/1.45 var(--font-mono); white-space: pre; pointer-events: none; }
    #help { position: fixed; right: 12px; bottom: 12px; padding: 8px 10px; background: var(--hud-bg); border-radius: var(--radius);
      font: 11px/1.4 var(--font-ui); color: var(--hud-muted); pointer-events: none; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "../../vendor/three/three.module.js",
      "rapier": "../../vendor/rapier/rapier.mjs"
    }
  }
  </script>
</head>
<body>
  <div id="app"></div>
  <div id="info">loading…</div>
  <div id="help">drag: orbit · wheel: zoom · WASD/arrows: move focus · ?seed=N ?cam=top|path|hub ?debug=1 ?routes=1 ?detail=0</div>
  <div id="fatal" hidden role="alert"></div>
  <script type="module">
    import * as THREE from "three";
    import { createRenderer } from "../../js/core/renderer.js";
    import { initPhysics, GROUP, groups } from "../../js/core/physics.js";
    import { Rng } from "../../js/core/rng.js";
    import { WORLD, PHYSICS } from "../../js/config.js";
    import { showFatal } from "../../js/core/errors.js";
    import { createTerrain } from "../../js/world/terrain.js";
    import { createGroundDetail } from "../../js/world/ground-detail.js";
    import { getGroundTextures } from "../../js/procgen/textures/ground.js";

    const q = new URLSearchParams(location.search);
    const seedRaw = q.get("seed");
    const seed = seedRaw == null || seedRaw === "" ? 1 : (Number.isFinite(Number(seedRaw)) ? Number(seedRaw) : seedRaw);
    const flag = (k) => q.has(k) && q.get(k) !== "0";
    const info = document.getElementById("info");

    async function main() {
      const t0 = performance.now();
      const physics = await initPhysics();
      const { renderer, scene, camera } = createRenderer(document.getElementById("app"));
      const rng = new Rng(seed);

      scene.background = new THREE.Color(0xa9c6dc);
      scene.fog = new THREE.Fog(0xa9c6dc, 90, 520);
      scene.add(new THREE.HemisphereLight(0xcfe3f5, 0x4a5a3a, 0.7));
      const sun = new THREE.DirectionalLight(0xffe4bd, 2.4);
      sun.position.set(-70, 60, -110);          // late-afternoon sun from the south-west
      sun.castShadow = true;
      sun.shadow.mapSize.set(2048, 2048);
      sun.shadow.camera.near = 1; sun.shadow.camera.far = 400;
      sun.shadow.camera.left = -90; sun.shadow.camera.right = 90; sun.shadow.camera.top = 90; sun.shadow.camera.bottom = -90;
      sun.shadow.bias = -0.0006; sun.shadow.normalBias = 0.05;
      scene.add(sun, sun.target);

      const t1 = performance.now();
      getGroundTextures(rng.fork("terrain").fork("textures").seed);   // same seed derivation as createTerrain → timed separately
      const tTex = performance.now();
      const terrain = createTerrain({ rng, physics, scene, size: WORLD.size, resolution: 2 });
      const t2 = performance.now();
      const detail = flag("detail") || !q.has("detail") ? createGroundDetail({ rng, scene, terrain }) : null;
      const t3 = performance.now();

      // --- terrain statistics ------------------------------------------------------------------
      const { heights, N } = terrain.field;
      let hMin = Infinity, hMax = -Infinity, slopeMax = 0, slopeSum = 0, samples = 0;
      const half = WORLD.size / 2;
      for (let iz = 1; iz < N - 1; iz += 2) for (let ix = 1; ix < N - 1; ix += 2) {
        const h = heights[iz * N + ix]; hMin = Math.min(hMin, h); hMax = Math.max(hMax, h);
        const s = terrain.slopeAt(-half + ix * 2, -half + iz * 2); slopeMax = Math.max(slopeMax, s); slopeSum += s; samples++;
      }
      let pathSlopeMax = 0;
      for (const r of terrain.routes) for (let k = 1; k < r.heights.length; k++) pathSlopeMax = Math.max(pathSlopeMax, Math.atan(Math.abs(r.heights[k] - r.heights[k - 1]) / 1));

      // --- collider check: rays vs heightAt (after the first step – the broad phase is built there)
      const R = physics.RAPIER;
      let rayMaxErr = 0, rayMisses = 0, rayChecked = false;
      const runRayCheck = () => {
        const crng = rng.fork("collider-check");
        for (let i = 0; i < 80; i++) {
          const x = crng.float(-half + 3, half - 3), z = crng.float(-half + 3, half - 3);
          const hit = physics.world.castRay(new R.Ray({ x, y: 300, z }, { x: 0, y: -1, z: 0 }), 600, true, undefined, groups(0xffff, GROUP.TERRAIN));
          if (!hit) { rayMisses++; continue; }
          rayMaxErr = Math.max(rayMaxErr, Math.abs((300 - hit.timeOfImpact) - terrain.heightAt(x, z)));
        }
        rayChecked = true;
      };

      // --- test spheres ---------------------------------------------------------------------
      const spawn = terrain.spawn;
      const ballSpots = [[spawn.x, spawn.z], [spawn.x + 30, spawn.z + 60], [terrain.hubs[3].x - 40, terrain.hubs[3].z - 30]];
      const balls = ballSpots.map(([x, z]) => {
        const body = physics.world.createRigidBody(R.RigidBodyDesc.dynamic().setTranslation(x, terrain.heightAt(x, z) + 6, z).setLinearDamping(0.2).setAngularDamping(0.5));
        physics.world.createCollider(R.ColliderDesc.ball(0.5).setRestitution(0.2).setFriction(0.9).setCollisionGroups(groups(GROUP.DYNAMIC)), body);
        const mesh = new THREE.Mesh(new THREE.SphereGeometry(0.5, 24, 16), new THREE.MeshStandardMaterial({ color: 0xd8342c, roughness: 0.4 }));
        mesh.castShadow = true; scene.add(mesh);
        return { body, mesh };
      });

      // --- optional debug overlays -----------------------------------------------------------
      if (flag("debug")) physics.setDebug(scene, true);
      if (flag("routes")) {
        for (const r of terrain.routes) {
          const pts = [];
          for (let k = 0; k < r.x.length; k++) pts.push(new THREE.Vector3(r.x[k], terrain.heightAt(r.x[k], r.z[k]) + 0.4, r.z[k]));
          scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({ color: 0xffff00 })));
        }
        for (const h of terrain.hubs) {
          const ring = new THREE.Mesh(new THREE.RingGeometry(h.radius - 0.4, h.radius, 48), new THREE.MeshBasicMaterial({ color: 0x00ffff, side: THREE.DoubleSide }));
          ring.rotation.x = -Math.PI / 2; ring.position.set(h.x, h.y + 0.3, h.z); scene.add(ring);
        }
      }

      // --- camera: orbit around a focus point -----------------------------------------------
      const focus = new THREE.Vector3(spawn.x, spawn.y + 2, spawn.z + 40);
      let yaw = Math.PI * 0.82, pitch = 0.32, dist = 60;
      const cam = q.get("cam");
      if (cam === "top") { pitch = 1.45; dist = 520; focus.set(0, 20, 0); }
      if (cam === "path") { const r = terrain.routes[1]; const k = Math.floor(r.x.length * 0.5); focus.set(r.x[k], terrain.heightAt(r.x[k], r.z[k]) + 1.5, r.z[k]); dist = 14; pitch = 0.22; yaw = Math.PI * 0.95; }
      if (cam === "hub") { focus.set(spawn.x, spawn.y + 1, spawn.z); dist = 28; pitch = 0.3; yaw = Math.PI * 0.6; }
      const updateCamera = () => {
        camera.position.set(
          focus.x + Math.sin(yaw) * Math.cos(pitch) * dist,
          focus.y + Math.sin(pitch) * dist,
          focus.z + Math.cos(yaw) * Math.cos(pitch) * dist);
        const ground = terrain.heightAt(camera.position.x, camera.position.z);
        if (camera.position.y < ground + 1.2) camera.position.y = ground + 1.2;
        camera.lookAt(focus);
        sun.target.position.copy(focus); sun.position.copy(focus).add(new THREE.Vector3(-70, 60, -110)); sun.shadow.camera.updateProjectionMatrix();
      };
      let dragging = false, lastX = 0, lastY = 0;
      const el = renderer.domElement;
      el.addEventListener("pointerdown", (e) => { dragging = true; lastX = e.clientX; lastY = e.clientY; });
      window.addEventListener("pointerup", () => { dragging = false; });
      window.addEventListener("pointermove", (e) => {
        if (!dragging) return;
        yaw -= (e.clientX - lastX) * 0.005; pitch = Math.min(1.5, Math.max(-0.2, pitch + (e.clientY - lastY) * 0.005));
        lastX = e.clientX; lastY = e.clientY;
      });
      el.addEventListener("wheel", (e) => { dist = Math.min(600, Math.max(4, dist * (1 + Math.sign(e.deltaY) * 0.1))); }, { passive: true });
      const keys = new Set();
      window.addEventListener("keydown", (e) => keys.add(e.key.toLowerCase()));
      window.addEventListener("keyup", (e) => keys.delete(e.key.toLowerCase()));

      // --- loop ------------------------------------------------------------------------------
      let last = performance.now(), acc = 0, frames = 0, fpsTime = 0, fps = 0;
      const stepDt = 1 / PHYSICS.hz;
      const tick = (now) => {
        const dt = Math.min(0.1, (now - last) / 1000); last = now;
        acc += dt;
        let stepped = false;
        while (acc >= stepDt) { physics.step(); acc -= stepDt; stepped = true; }
        if (!rayChecked && stepped) runRayCheck();
        for (const b of balls) { const t = b.body.translation(); b.mesh.position.set(t.x, t.y, t.z); }
        const mv = 40 * dt, fwd = new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw)), right = new THREE.Vector3(fwd.z, 0, -fwd.x);
        if (keys.has("w") || keys.has("arrowup")) focus.addScaledVector(fwd, mv);
        if (keys.has("s") || keys.has("arrowdown")) focus.addScaledVector(fwd, -mv);
        if (keys.has("a") || keys.has("arrowleft")) focus.addScaledVector(right, -mv);
        if (keys.has("d") || keys.has("arrowright")) focus.addScaledVector(right, mv);
        if (keys.size) focus.y = terrain.heightAt(focus.x, focus.z) + 2;
        updateCamera();
        detail && detail.update(dt);
        physics.updateDebug();
        renderer.render(scene, camera);
        frames++; fpsTime += dt;
        if (fpsTime >= 0.5) { fps = frames / fpsTime; frames = 0; fpsTime = 0; refreshInfo(); }
        requestAnimationFrame(tick);
      };
      const refreshInfo = () => {
        const ballErr = balls.map((b) => { const t = b.body.translation(); return (t.y - 0.5 - terrain.heightAt(t.x, t.z)).toFixed(3); }).join(" / ");
        const detailCount = detail ? detail.meshes.reduce((s, m) => s + m.count, 0) : 0;
        info.textContent = [
          `terrain dev · seed ${seed} · ${fps.toFixed(0)} fps · draw calls ${renderer.info.render.calls} · tris ${renderer.info.render.triangles.toLocaleString()}`,
          `gen: physics ${(t1 - t0).toFixed(0)} ms · ground textures ${(tTex - t1).toFixed(0)} ms · terrain ${(t2 - tTex).toFixed(0)} ms · detail ${(t3 - t2).toFixed(0)} ms · instances ${detailCount}`,
          `height ${hMin.toFixed(1)}…${hMax.toFixed(1)} m (drop ${(hMax - hMin).toFixed(1)}) · slope mean ${(slopeSum / samples * 180 / Math.PI).toFixed(1)}° max ${(slopeMax * 180 / Math.PI).toFixed(1)}° · path max ${(pathSlopeMax * 180 / Math.PI).toFixed(1)}°`,
          `collider ray check: max |ray−heightAt| ${rayMaxErr.toFixed(3)} m, misses ${rayMisses}/80 · balls Δy ${ballErr}`,
          `spawn (${spawn.x.toFixed(1)}, ${spawn.y.toFixed(1)}, ${spawn.z.toFixed(1)}) · hubs ${terrain.hubs.map((h) => `${h.id}@(${h.x.toFixed(0)},${h.z.toFixed(0)}) r${h.radius}`).join(" · ")}`,
          `isPath(spawn+2m north) ${terrain.isPath(spawn.x, spawn.z + 2)} · camera (${camera.position.x.toFixed(0)}, ${camera.position.y.toFixed(0)}, ${camera.position.z.toFixed(0)})`,
        ].join("\n");
      };
      updateCamera();
      refreshInfo();
      window.WIPFEL = { terrain, detail, scene, camera, renderer, physics, seed };
      requestAnimationFrame(tick);
    }

    main().catch((err) => showFatal("terrain dev page failed", err));
  </script>
</body>
</html>
